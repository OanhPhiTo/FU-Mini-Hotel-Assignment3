# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
spring.application.name=A3OanhTP_SE1910
server.port=8080

# ===================================================================
# MICROSOFT SQL SERVER CONFIGURATION
# Database Name: A3OanhTP_SE1910 (port 1433)
# Environment variables ONLY for SQL account credentials
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A3OanhTP_SE1910;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ===================================================================
# HIBERNATE & JPA SETTINGS
# Exact physical naming strategy preserves schema PascalCase / camelCase
# (e.g. BookingReservationID, RoomID, CustomerID)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# ===================================================================
# JACKSON CONFIGURATION
# ===================================================================
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===================================================================
# STAFF ACCOUNT CONFIGURATION
# Loaded directly from application properties
# ===================================================================
app.staff.email=staff@fuminihotel.com
app.staff.password=Admin@123
app.staff.name=Hotel Administrator

# ===================================================================
# JWT (JSON WEB TOKEN) CONFIGURATION
# Secret key is HS256 256-bit (64 hex characters)
# ===================================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ===================================================================
# CORS CONFIGURATION
# ===================================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
